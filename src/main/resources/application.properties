spring.application.name=SistemaSLA

# Porta do servidor: o Render define a variavel PORT; localmente usa 8080
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SistemaSLA}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

joinfaces.faces.project-stage=Development
joinfaces.faces-servlet.url-mappings=*.xhtml
server.servlet.session.timeout=30m
spring.web.resources.cache.period=0
