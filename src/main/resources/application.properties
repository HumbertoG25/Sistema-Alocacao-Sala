spring.application.name=sistema-sla

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistemasla?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

joinfaces.faces.project-stage=Development
joinfaces.faces-servlet.url-mappings=*.xhtml
server.servlet.session.timeout=30m
spring.web.resources.cache.period=0
