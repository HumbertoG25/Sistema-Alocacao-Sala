<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>SLA - Cadastro de Usuário</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet library="css" name="estilo.css"/>
    </h:head>
    <h:body styleClass="pagina-painel">
        <header class="topo">
            <div class="container topo-conteudo">
                <div class="marca">
                    <span class="marca-simbolo">SLA</span>
                    <span>Painel Administrativo</span>
                </div>
                <div class="usuario-topo">
                    <div class="usuario-texto">
                        <strong>Administrador</strong>
                        <span>Gerenciamento de Usuários</span>
                    </div>
                    <div class="avatar">ADM</div>
                    <h:form style="display:inline;">
                        <h:commandButton value="Sair" action="#{loginBean.sair}" styleClass="botao-sair"/>
                    </h:form>
                </div>
            </div>
        </header>

        <main class="container conteudo-painel">
            <div class="boas-vindas">
                <div>
                    <span class="etiqueta etiqueta-verde">Módulo de Cadastros</span>
                    <h1>Cadastrar Aluno / Professor</h1>
                    <p>Adicione um novo usuário ao sistema informando seus dados de acesso e perfil correspondente.</p>
                </div>
                <div>
                    <h:link value="← Voltar ao Menu" outcome="/menu.xhtml" styleClass="botao-sair" style="text-decoration: none; display: inline-block; text-align: center; line-height: normal;" />
                </div>
            </div>

            <div class="tabela-area" style="padding: 35px; max-width: 600px; margin: 0 auto;">
                <div class="tabela-cabecalho" style="padding: 0 0 20px 0;">
                    <h2>Formulário do Usuário</h2>
                    <span>Preencha os dados</span>
                </div>

                <h:form id="formUsuario" styleClass="formulario">
                    <h:messages globalOnly="true" styleClass="mensagem-erro"/>

                    <div class="campo">
                        <h:outputLabel value="Nome Completo:" />
                        <h:inputText value="#{usuarioBean.usuario.nome}" required="true" requiredMessage="Informe o nome." autocomplete="off"/>
                    </div>

                    <div class="campo">
                        <h:outputLabel value="E-mail Institucional:" />
                        <h:inputText value="#{usuarioBean.usuario.email}" required="true" requiredMessage="Informe o e-mail." autocomplete="off"/>
                    </div>

                    <div class="campo">
                        <h:outputLabel value="Senha de Acesso:" />
                        <h:inputSecret value="#{usuarioBean.usuario.senha}" required="true" requiredMessage="Informe a senha." autocomplete="off"/>
                    </div>

                    <div class="campo">
                        <h:outputLabel value="Perfil de Acesso:" />
                        <h:selectOneMenu value="#{usuarioBean.usuario.perfilId}" required="true" requiredMessage="Selecione o perfil." styleClass="campo input" style="height: 50px;">
                            <f:selectItem itemLabel="Selecione o perfil..." itemValue="" />
                            <f:selectItem itemLabel="1 - Aluno" itemValue="1" />
                            <f:selectItem itemLabel="2 - Professor" itemValue="2" />
                            <f:selectItem itemLabel="3 - Administrador" itemValue="3" />
                        </h:selectOneMenu>
                    </div>

                    <h:commandButton value="Salvar Usuário" action="#{usuarioBean.salvarUsuario}" styleClass="botao botao-principal" style="width: 100%; margin-top: 10px;" />
                </h:form>
            </div>
        </main>
    </h:body>
</html>
